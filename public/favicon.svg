<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="pj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Obsidian Square Background -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#040406" stroke="url(#pj-grad)" stroke-width="4" />
  
  <!-- Outer Glow Accent -->
  <rect x="12" y="12" width="76" height="76" rx="18" fill="url(#pj-grad)" opacity="0.15" />

  <!-- Monogram Text PJ -->
  <text 
    x="50" 
    y="65" 
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" 
    font-weight="900" 
    font-size="46" 
    fill="url(#pj-grad)" 
    text-anchor="middle"
    letter-spacing="-2"
    filter="url(#glow)"
  >PJ</text>
</svg>
